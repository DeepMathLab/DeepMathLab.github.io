<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Learning an approximation with physical constraints</title>
  <desc id="desc">A conceptual physics-informed neural-network workflow. Coordinates enter a neural approximation. Its output and derivatives are evaluated against the differential equation and boundary conditions. These constraints guide updates to the approximation during training, shown by a feedback arrow. No equation, physical solution, or numerical result is being asserted.</desc>
