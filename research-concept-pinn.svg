    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="m2 1 6 4-6 4" fill="none" stroke="#365BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect width="800" height="500" fill="#FFFFFF"/>
  <g fill="none" stroke="#D5DCE8" stroke-width="1.5">
    <circle cx="94" cy="240" r="48"/>
    <path d="M30 240h128M94 176v128"/>
  </g>
  <circle cx="116" cy="217" r="7" fill="#365BFF"/>
  <rect x="238" y="157" width="204" height="166" rx="9" fill="#F7F8FC" stroke="#D5DCE8" stroke-width="1.5"/>
  <g fill="none" stroke="#BEC9DE" stroke-width="1.4">
    <path d="M276 211 340 190M276 211 340 240M276 211 340 290M276 269 340 190M276 269 340 240M276 269 340 290M340 190 404 240M340 240 404 240M340 290 404 240"/>
  </g>
  <g fill="#FFFFFF" stroke="#365BFF" stroke-width="2">
    <circle cx="276" cy="211" r="9"/><circle cx="276" cy="269" r="9"/>
    <circle cx="340" cy="190" r="9"/><circle cx="340" cy="240" r="9"/><circle cx="340" cy="290" r="9"/>
  </g>
  <circle cx="404" cy="240" r="10" fill="#365BFF"/>
  <g fill="none" stroke="#365BFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 240h59" marker-end="url(#arrow)"/>
    <path d="M442 240h48M490 240v-49h55M490 240v67h55" marker-end="url(#arrow)"/>
  </g>
  <circle cx="490" cy="240" r="4" fill="#365BFF"/>
  <g fill="#FFFFFF" stroke="#D5DCE8" stroke-width="1.5">
    <rect x="565" y="145" width="205" height="90" rx="6"/>
    <rect x="565" y="264" width="205" height="90" rx="6"/>
  </g>
  <path d="M769 190h15v199H340v-48" fill="none" stroke="#365BFF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
