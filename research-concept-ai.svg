  <title id="title">Weight initialization and signal propagation</title>
  <desc id="desc">Conceptual diagram of an input passing through two weighted neural-network layers to an output. A blue path highlights signal propagation, and an initialization bracket indicates the weights set before training. The nodes and connections illustrate a method, not a trained model or measured result.</desc>
