    <circle cx="290" cy="164" r="13"/><circle cx="290" cy="276" r="13"/><circle cx="290" cy="332" r="13"/>
    <circle cx="500" cy="164" r="13"/><circle cx="500" cy="220" r="13"/><circle cx="500" cy="332" r="13"/>
    <circle cx="704" cy="218" r="13"/>
  </g>
  <g fill="#365BFF" stroke="#FFFFFF" stroke-width="3">
    <circle cx="96" cy="248" r="14"/><circle cx="290" cy="220" r="14"/><circle cx="500" cy="276" r="14"/><circle cx="704" cy="278" r="14"/>
